[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astock"
version = "0.1.0"
description = "A-share stock screening system with pluggable data sources, storage and strategies"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "astock" }]
dependencies = [
    "akshare>=1.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "SQLAlchemy>=2.0.0",
    "tenacity>=8.0.0",
    "tqdm>=4.65.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
tushare = ["tushare>=1.2.89"]
baostock = ["baostock>=0.8.8"]
dev = ["pytest>=7.0", "ruff>=0.1.0", "mypy>=1.5"]

[project.scripts]
astock = "astock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
